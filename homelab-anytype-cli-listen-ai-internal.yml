# Homelab overlay — bind anytype-cli HTTP API on 0.0.0.0:31012 for LiteLLM / ai_internal.
#
# Upstream docker-compose publishes "${ANYTYPE_CLI_API_PORT}:31012"; that only maps
# host→container. The anytype process still defaults to 127.0.0.1:31012 unless serve
# gets --listen-address (see anytype-cli README, Network configuration).
#
# Use an explicit shell wrapper so merge with ENTRYPOINT ["anytype"] + CMD ["serve"]
# cannot drop flags (some compose/Komodo paths were observed to leave 127.0.0.1:31012).
#
# Ref: https://github.com/anyproto/anytype-cli#network-configuration

services:
  anytype-cli:
    entrypoint: ["/bin/sh", "-c"]
    command: ["exec anytype serve --listen-address 0.0.0.0:31012"]
